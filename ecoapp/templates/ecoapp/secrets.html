{% load static %}
<section id="secrets" class="secrets-section">
    <h1>Секреты Камчатки</h1>
    
    <!-- Контейнер для слайдера -->
    <div class="secrets-slider-container">
        <div class="secrets-slider">
            <!-- Изображение -->
            <img src="/static/ecoapp/images/secret1.png" alt="Секрет Камчатки 1" id="slider-img">

            <!-- Стрелки -->
            <button class="arrow prev" onclick="changeImage(-1)">&#10094;</button>
            <button class="arrow next" onclick="changeImage(1)">&#10095;</button>
        </div>
        
        <!-- Точки внизу -->
        <div class="dots-container">
            <span class="dot active" onclick="setImage(0)"></span>
            <span class="dot" onclick="setImage(1)"></span>
            <span class="dot" onclick="setImage(2)"></span>
            <span class="dot" onclick="setImage(3)"></span>
            <span class="dot" onclick="setImage(4)"></span>
            <span class="dot" onclick="setImage(5)"></span>
            <span class="dot" onclick="setImage(6)"></span>
        </div>
    </div>
    
    <!-- Контейнер для описания -->
    <div class="secret-description-container">
        <p class="secret-description">Описание первого секрета Камчатки. Здесь будет информация о природе и её уникальных особенностях.</p>
    </div>
</section>

<script src="{% static 'ecoapp/js/secret-cards.js' %}"></script>
