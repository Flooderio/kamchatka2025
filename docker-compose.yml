services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kamchatka}
      POSTGRES_USER: ${POSTGRES_USER:-kamchatka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamchatka}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kamchatka} -d ${POSTGRES_DB:-kamchatka}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_reference_data"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    restart: unless-stopped

  bot:
    build: .
    command: python app.py
    profiles:
      - bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app

volumes:
  postgres_data:
